name: Build, test and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm test

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/iptv-webui
          tags: |
            type=raw,value=latest
            type=sha,format=short
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: build
    # Deploy to the self-hosted box (behind NAT) via an ephemeral Tailscale
    # node + a forced-command deploy key (only redeploys the container, no
    # shell). All host/target details come from repo secrets so nothing
    # infra-specific lives in this public workflow.
    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}

      - name: Deploy
        run: |
          install -m700 -d ~/.ssh
          printf '%s\n' "${{ secrets.HESTIA_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new \
            "${{ secrets.HESTIA_SSH_TARGET }}" iptv-webui

      - name: Wait for health check with SHA match
        env:
          HEALTH_URL: ${{ secrets.HEALTH_URL }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          for i in $(seq 1 45); do
            body=$(curl -sf "${HEALTH_URL}" || echo '')
            sha=$(echo "$body" | sed -n 's/.*"sha":"\([^"]*\)".*/\1/p')
            if [ "$sha" = "$EXPECTED_SHA" ]; then
              echo "health ok (sha=$sha)"; exit 0
            fi
            echo "attempt $i: sha=${sha:-none} (want $EXPECTED_SHA) — retrying"
            sleep 4
          done
          echo "health check timed out waiting for sha=$EXPECTED_SHA"; exit 1
