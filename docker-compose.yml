services:
  iptv-webui:
    image: ghcr.io/REPLACE_ME/iptv-webui:latest
    container_name: iptv-webui
    restart: unless-stopped
    expose:
      - "3000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      # Local media library (owner-only "Disk" section). Point DISK_MEDIA_DIR
      # (.env) at the in-container path. Omit both to disable the Disk
      # feature. Read-write, NOT :ro — the "Save to Disk" download feature
      # writes new files into <path>/Downloads/. A :ro mount here makes
      # every queued download fail at fs.mkdirSync/fs.createWriteStream.
      # - /mnt/media/new-volume/Movies:/media/movies
    # VAAPI transcode for disk avi/DTS (+ panel MKV). Needs the iGPU passed in.
    # devices:
    #   - /dev/dri:/dev/dri
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.iptv-webui.rule=Host(`iptv.example.com`)"
      - "traefik.http.routers.iptv-webui.entrypoints=websecure"
      - "traefik.http.routers.iptv-webui.tls=true"
      - "traefik.http.routers.iptv-webui.tls.certresolver=letsencrypt"
      - "traefik.http.services.iptv-webui.loadbalancer.server.port=3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
